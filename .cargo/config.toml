[alias]
xtask = "run --manifest-path vendor/rust-analyzer/Cargo.toml --package xtask --bin xtask --"
tq = "test -- -q"
qt = "tq"
lint = "clippy --all-targets -- --cap-lints warn"
codegen = "run --manifest-path vendor/rust-analyzer/Cargo.toml --package xtask --bin xtask -- codegen"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.arm-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc-8"

[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }
