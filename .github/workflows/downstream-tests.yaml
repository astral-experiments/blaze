name: Downstream tests
run-name: Single-file tests on ${{ inputs.blaze_ref }} (trials ${{ inputs.trials }}, probe ${{ inputs.probe }})
on:
  workflow_dispatch:
    inputs:
      blaze_ref:
        description: Blaze revision to build and measure
        default: fc6eaf680e4cf47e9bfe6e7b6406ab0bb263b9c7
        required: true
      probe:
        description: Only run the affected assertion on Blaze and save compiler diagnostics
        type: boolean
        default: false
      trials:
        description: JSON array of paired trial numbers (odd starts with Cargo)
        default: "[1,2,3,4]"
        required: true
      suites:
        description: JSON array of projects
        default: '["ruff","ty","uv"]'
        required: true
permissions:
  contents: read
jobs:
  benchmark:
    name: ${{ matrix.suite }} pair ${{ matrix.trial }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suites) }}
        trial: ${{ fromJSON(inputs.trials) }}
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 330
    env:
      FILE_BENCH_PROBE: ${{ inputs.probe && '1' || '0' }}
      SUITE: ${{ matrix.suite }}
      TRIAL: ${{ matrix.trial }}
      BLAZE_SANDBOX: 'off'
      RA_JIT_SANDBOX: 'off'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '16'
      RUST_MIN_STACK: '33554432'
      RUST_TEST_THREADS: '1'
      UV_HTTP_RETRIES: '5'
      INSTA_UPDATE: 'no'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: benchmark
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.blaze_ref }}
          path: blaze
          persist-credentials: false
      - name: Install the pinned Rust toolchain and build Blaze outside the measurements
        working-directory: blaze
        run: |
          tc=$(cat harness/toolchain)
          rustup toolchain install "$tc" --profile minimal -c rust-src
          cargo +"$tc" build --locked --release -p ra-jit --target-dir "$PWD/target"
          echo "RUSTUP_TOOLCHAIN=$tc" >> "$GITHUB_ENV"
          echo "$PWD/target/release" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$RUNNER_TEMP/bench-registry" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.suite == 'uv' && 'astral-sh/uv' || 'astral-sh/ruff' }}
          ref: ${{ matrix.suite == 'uv' && '5b5a53e1803d426ba04f4af8ff7d6ff747548218' || '07872adbafa7c00f42f1174d8aa3c3e324033009' }}
          path: downstream
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.5'
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
          enable-cache: false
      - name: Install uv's Linux integration test dependencies
        if: matrix.suite == 'uv'
        working-directory: downstream
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
        run: |
          export UV_PYTHON_CACHE_DIR="$RUNNER_TEMP/uv-test-python"
          echo "UV_PYTHON_CACHE_DIR=$UV_PYTHON_CACHE_DIR" >> "$GITHUB_ENV"
          uv python install
          uv python install 3.12d 3.13d 3.13t 3.13td
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            git/noble-updates git-man/noble-updates libcurl3t64-gnutls/noble-updates git-lfs gnome-keyring
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$RUNNER_TEMP/uv-test-bus"
          dbus-daemon --session --fork --address="$DBUS_SESSION_BUS_ADDRESS"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'uv-test'
          gdbus call --session --dest org.freedesktop.secrets \
            --object-path /org/freedesktop/secrets --method org.freedesktop.Secret.Service.ReadAlias default
          sudo mkdir /tmpfs
          sudo mount -t tmpfs -o size=256m tmpfs /tmpfs
          sudo chown "$(id -u):$(id -g)" /tmpfs
          echo "UV_INTERNAL__TEST_NOCOW_FS=/tmpfs" >> "$GITHUB_ENV"
          echo "UV_INTERNAL__TEST_ALT_FS=/tmpfs" >> "$GITHUB_ENV"
          echo "UV_INTERNAL__TEST_LOWLINKS_FS=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prefetch locked sources and create the Python test environment
        working-directory: downstream
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          if [[ "$SUITE" == uv ]]; then group=(--only-group test); else group=(--only-dev); fi
          uv run --locked "${group[@]}" python -V
          nproc
          df -h .
      - name: Time the same test file clean and after editing its production code and assertion
        working-directory: downstream
        run: |
          unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_INCREMENTAL CARGO_BUILD_BUILD_DIR
          unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_RUSTC_WRAPPER CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER
          python3 -u ../benchmark/.github/scripts/file_bench/bench.py "$SUITE" "$TRIAL" "$RUNNER_TEMP/benchmark-results"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: file-${{ matrix.suite }}-${{ matrix.trial }}
          path: ${{ runner.temp }}/benchmark-results
          if-no-files-found: warn
          retention-days: 7
