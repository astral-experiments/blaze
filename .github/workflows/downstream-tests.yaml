name: Companion reuse regression
run-name: Compare the clean companion and first edit with pinned Cargo
on: workflow_dispatch
permissions:
  contents: read
jobs:
  regression:
    name: ${{ matrix.os }} / ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        os: [namespace-profile-ubuntu-24-04-16, macos-15]
        version: [parent, candidate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BLAZE_SANDBOX: 'off'
      RA_JIT_SANDBOX: 'off'
      RUST_MIN_STACK: '33554432'
      VERSION_UNDER_TEST: ${{ matrix.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 728da1af6a9375611d69bd9a40b6f03cb60282ae
          path: regression
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.version == 'parent' && 'c0dfac412ad826be2a2c9998724ea5a7636c98f4' || '728da1af6a9375611d69bd9a40b6f03cb60282ae' }}
          path: compiler
          persist-credentials: false
      - name: Build the compiler under test
        working-directory: compiler
        run: |
          tc=$(cat harness/toolchain)
          rustup toolchain install "$tc" --profile minimal -c rust-src
          cargo +"$tc" build --release --locked -p ra-jit
          echo "RUSTUP_TOOLCHAIN=$tc" >> "$GITHUB_ENV"
          echo "RA_JIT_BIN=$PWD/target/release/ra-jit" >> "$GITHUB_ENV"
      - name: Check the fresh binary, production edit, and assertion repair
        run: |
          python3 - <<'PY'
          import os, sys, tempfile
          sys.path.insert(0, "regression/harness")
          from cargo_ra_jit import optimized_test_dependencies
          failed = []
          def check(label, passed, detail):
              print("PASS" if passed else "FAIL", label, "" if passed else detail, flush=True)
              if not passed:
                  failed.append(label)
          with tempfile.TemporaryDirectory() as root:
              optimized_test_dependencies(root, check)
          expected = ["the unoptimized test uses Cargo's executable without compiling it twice"] if os.environ["VERSION_UNDER_TEST"] == "parent" else []
          assert failed == expected, (failed, expected)
          PY
