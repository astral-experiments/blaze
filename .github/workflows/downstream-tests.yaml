name: Native callback sibling edit
run-name: Reduced Ruff initializer before and after the fix
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [namespace-profile-ubuntu-24-04-16, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUST_MIN_STACK: '33554432'
      BLAZE_SANDBOX: 'off'
      RA_JIT_SANDBOX: 'off'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          ref: 079b1dd06861a4678ac0d7a68a8108f006386459
          persist-credentials: false
      - name: Prepare the fixture from the candidate and its pinned compiler
        run: |
          tc=$(cat harness/toolchain)
          rustup toolchain install "$tc" --profile minimal -c rust-src
          echo "RUSTUP_TOOLCHAIN=$tc" >> "$GITHUB_ENV"
          echo "RA_JIT_BIN=$PWD/target/release/ra-jit" >> "$GITHUB_ENV"
          cp harness/staticcallbacks.py "$RUNNER_TEMP/staticcallbacks.py"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "staticcallbacks.py"
          src = p.read_text()
          marker = '                if actual != f"{value} {value} {tag} {label}":'
          oracle = '''                ref_env = dict(env, CARGO_TARGET_DIR=str(root / "rustc-target"))
                          reference = subprocess.check_output(["cargo", "run", "--quiet", "--offline"], cwd=root, env=ref_env, text=True).strip()
                          print(f"pinned rustc {reference!r}, Blaze {actual!r}", flush=True)
                          assert actual == reference'''.replace("\n                          ", "\n                ")
          assert src.count(marker) == 1
          p.write_text(src.replace(marker, oracle + "\n" + marker))
          PY
      - name: Exercise the original regression on the parent compiler
        run: |
          git checkout --detach bb8fba44a5539e195166f81f216d6c372014c20f
          cargo build --release --locked -p ra-jit
          if python3 "$RUNNER_TEMP/staticcallbacks.py" > "$RUNNER_TEMP/parent.log" 2>&1; then
            test "$RUNNER_OS" != Linux
          else
            grep -Fq 'An unrelated body edit invalidated the callback' "$RUNNER_TEMP/parent.log"
          fi
          cat "$RUNNER_TEMP/parent.log"
      - name: Compare the fixed compiler with pinned rustc on every edit
        run: |
          git checkout --detach 079b1dd06861a4678ac0d7a68a8108f006386459
          cargo build --release --locked -p ra-jit
          python3 "$RUNNER_TEMP/staticcallbacks.py"
