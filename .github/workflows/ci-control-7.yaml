name: Native macOS 15 Namespace comparison
on:
  push:
    branches: [charlie/ci-control-pr-7]
permissions:
  contents: read
jobs:
  native:
    runs-on: nscloud-macos-sequoia-arm64-6x14
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RA_JIT_SANDBOX: ''
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      RA_JIT_BACKEND: cranelift
      RA_JIT_OPT: 2
      RA_JIT_EMIT: fast
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ea109290eb43c92af26408c96f7e3ac672c4d8b3
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: "false"
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Build on Sequoia
        env:
          RUSTC_WRAPPER: sccache
        run: |
          sw_vers
          nix develop --command cargo build -p ra-jit --release --features llvm --locked
          echo "RA_JIT_BIN=$PWD/target/release/ra-jit" >> "$GITHUB_ENV"
      - name: Run the complete shard on Sequoia
        run: python3 harness/ci.py quick-2
