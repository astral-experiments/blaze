name: Compare generated-input fixes against unchanged, edited, and restored inputs
on:
  push:
    branches: [charlie/ci-control-pr-7]
permissions:
  contents: read
  actions: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: nscloud-macos-sequoia-arm64-6x14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9d66eaefc31b47720c2c1870c9d19eba6d782b4e
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: nix develop --command cargo build -p ra-jit --release --features llvm --locked
        env:
          RUSTC_WRAPPER: sccache
      - run: tar -cf probe.tar ra-jit cargo-ra-jit ra-jit-rustc ra-jit-rustc-first
        working-directory: target/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: probe-${{ matrix.platform }}
          path: target/release/probe.tar
          retention-days: 1
  fixture:
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: 47
            os: ubuntu-24.04
            artifact: ra-jit-linux-x64
            source-run: 40464047658
          - candidate: 47
            os: macos-15
            artifact: ra-jit-macos-arm64
            source-run: 40464047658
          - candidate: 48
            os: ubuntu-24.04
            artifact: ra-jit-linux-x64
            source-run: 40464690857
          - candidate: 48
            os: macos-15
            artifact: probe-macos
            source-run: 0
    name: Candidate ${{ matrix.candidate }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9d66eaefc31b47720c2c1870c9d19eba6d782b4e
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: run
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.source-run || github.run_id }}
          github-token: ${{ github.token }}
          path: target/release
      - run: tar -xf ${{ matrix.source-run && 'ra-jit.tar' || 'probe.tar' }}
        working-directory: target/release
      - name: Exercise the original generated input and the edit and undo
        working-directory: harness
        shell: bash
        run: |
          git show 097e074391eefd9bb8f8935d9c53d63cba212cde:harness/testselect.py > testselect_original.py
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile
          import testselect
          import testselect_original
          binary = pathlib.Path("../target/release").resolve()
          failed = 0
          for label, module in (("original", testselect_original), ("edit-undo", testselect)):
              original_test = module.test
              def observed(ws, env, mode):
                  code, said = original_test(ws, env, mode)
                  print(f"Call {label} {backend}: exit={code} blaze={'[ra-jit]' in said} tests={module.RAN.findall(said)}", flush=True)
                  return code, said
              module.test = observed
              for backend in ("cranelift", "llvm"):
                  for trial in range(2 if label == "original" else 1):
                      with tempfile.TemporaryDirectory() as root, tempfile.TemporaryDirectory(dir="/tmp") as home:
                          env = dict(os.environ, PATH=f"{binary}:{os.environ['PATH']}", RA_JIT_BIN=str(binary/"ra-jit"),
                                     RA_JIT_BACKEND=backend, RA_JIT_OPT="2", RA_JIT_EMIT="fast", RA_JIT_HOME=home,
                                     RUST_BACKTRACE="0", CARGO_INCREMENTAL="0", CARGO_TERM_COLOR="never")
                          try:
                              result = module.unchanged_instances(root, env)
                              print(f"Result {label} {backend} {trial+1}: {result}", flush=True)
                              failed += result != "ok"
                          finally:
                              subprocess.run(["cargo", "ra-jit", "stop"], cwd=pathlib.Path(root)/"unchanged", env=env, capture_output=True)
          raise SystemExit(bool(failed))
          PY
