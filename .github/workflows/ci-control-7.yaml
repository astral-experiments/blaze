name: Trace the generated-input Cargo fallback
on:
  push:
    branches: [charlie/ci-control-pr-7]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: namespace-profile-ubuntu-24-04-16
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 097e074391eefd9bb8f8935d9c53d63cba212cde
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Record native lookup and source invalidation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          
          def replace(path, old, new):
              source = Path(path).read_text()
              assert source.count(old) == 1, (path, old)
              Path(path).write_text(source.replace(old, new))
          
          
          main = "crates/ra-jit/src/main.rs"
          codegen = "crates/hir-ty-codegen/mod.rs"
          
          replace(main, "            if !as_rustc_read {\n                changed.push(*file);",
                  '''            eprintln!("INCLUDE_TRACE input {} id={:?} prior={:?} now={:?} as_read={as_rustc_read}", path.display(), file, was.get(path), now.as_ref().map(|it| it.mtime));
                      if !as_rustc_read {
                          changed.push(*file);''')
          replace(main, "            let owners = ide_db::base_db::relevant_crates(db, file);\n            if owners.is_empty() {",
                  '''            let owners = ide_db::base_db::relevant_crates(db, file);
                      eprintln!("INCLUDE_TRACE owners {file:?} {:?}", owners.iter().map(|&it| crate_root_file(db, it.into())).collect::<Vec<_>>());
                      if owners.is_empty() {''')
          replace(main, "        self.known.distrust(db, &other);\n        // A file rustc did not read",
                  '''        for file in files {
                      if let Watched::Source(id) = file.file && unread.contains(&id) {
                          eprintln!("INCLUDE_TRACE distrust {} {} mtime={:?} built={built:?}", self.args.krate, file.path.display(), file.mtime);
                      }
                  }
                  self.known.distrust(db, &other);
                  // A file rustc did not read''')
          replace(main, "        self.table.get(path).or_else(private).map(str::to_owned)",
                  '''        if path.contains("::half") {
                      eprintln!("INCLUDE_TRACE lookup {path} table={:?} private={:?} has_linked={}", self.table.get(path), private(), self.rustcs().is_some());
                  }
                  self.table.get(path).or_else(private).map(str::to_owned)''')
          replace(codegen, "    pub fn touch(&mut self, db: &dyn HirDatabase, crates: Option<&[Crate]>) {\n        match crates {",
                  '''    #[track_caller]
              pub fn touch(&mut self, db: &dyn HirDatabase, crates: Option<&[Crate]>) {
                  eprintln!("INCLUDE_TRACE touch {} {:?}", std::panic::Location::caller(), crates.map(|v| v.iter().map(|it| it.root_file_id(db)).collect::<Vec<_>>()));
                  match crates {''')
          replace(codegen, '''        let symbol = if args.iter().all(|arg| arg.region().is_some()) {
                      // A test's path also names its descriptor. Resolve the function as an item.
                      self.symbols.function(func)?
                  } else {
                      self.symbols.path(&path)?
                  };
                  let symbol = self.rustc_copy(symbol, instance.checked)?;''',
                  '''        let candidate = if args.iter().all(|arg| arg.region().is_some()) {
                      self.symbols.function(func)
                  } else {
                      self.symbols.path(&path)
                  };
                  let symbol = candidate.clone().and_then(|s| self.rustc_copy(s, instance.checked));
                  if path.contains("unchanged") || path.starts_with("first") || path.starts_with("second") {
                      eprintln!("INCLUDE_TRACE forward {path} candidate={candidate:?} copies={:?} checked={} linked={symbol:?}", candidate.as_deref().map(|s| self.symbols.copies(s)), instance.checked);
                  }
                  let symbol = symbol?;''')
          PY
      - run: nix develop --command cargo build -p ra-jit --release --features llvm --locked
        env:
          RUSTC_WRAPPER: sccache
      - run: tar -cf probe.tar ra-jit cargo-ra-jit ra-jit-rustc ra-jit-rustc-first
        working-directory: target/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: probe-${{ matrix.platform }}
          path: target/release/probe.tar
          retention-days: 1
  trace:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 097e074391eefd9bb8f8935d9c53d63cba212cde
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: run
      - uses: actions/download-artifact@v8
        with:
          name: probe-linux
          path: target/release
      - run: tar -xf probe.tar
        working-directory: target/release
      - name: Compare the worker logs for failing and passing fixture runs
        working-directory: harness
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tempfile
          import testselect
          binary = pathlib.Path("../target/release").resolve()
          out = pathlib.Path(os.environ["RUNNER_TEMP"])/"include-evidence"
          out.mkdir()
          outcomes = set()
          for i in range(8):
              with tempfile.TemporaryDirectory() as root, tempfile.TemporaryDirectory(dir="/tmp") as home:
                  env = dict(os.environ, PATH=f"{binary}:{os.environ['PATH']}", RA_JIT_BIN=str(binary/"ra-jit"),
                             RA_JIT_BACKEND="llvm", RA_JIT_OPT="2", RA_JIT_EMIT="fast", RA_JIT_HOME=home,
                             CARGO_INCREMENTAL="0", CARGO_TERM_COLOR="never", RUST_BACKTRACE="0")
                  ws = pathlib.Path(root)/"unchanged"
                  try:
                      result = testselect.unchanged_instances(root, env)
                      print(f"Trial {i + 1}: {result}", flush=True)
                  finally:
                      subprocess.run(["cargo", "ra-jit", "stop"], cwd=ws, env=env, capture_output=True)
                  ok = result == "ok"
                  for worker in pathlib.Path(home).rglob("log"):
                      if not worker.is_file(): continue
                      log = worker.read_text(errors="replace")
                      (out/f"trial-{i+1}-{worker.parent.name}.log").write_text(log)
                      if ok not in outcomes:
                          print(f"Worker {worker.parent.name}", flush=True)
                          for line in log.splitlines():
                              if "INCLUDE_TRACE" in line or "left to rustc" in line or "from before the edit" in line:
                                  print(line[:1300], flush=True)
                  for exe in sorted((ws/"target/debug/deps").glob("*")):
                      if exe.is_file() and os.access(exe, os.X_OK) and exe.name.startswith(("first-", "second-", "unchanged-")):
                          syms = subprocess.run(["nm", "-P", str(exe)], capture_output=True, text=True).stdout.splitlines()
                          print(exe.name, [s[:250] for s in syms if "4half" in s], flush=True)
                  outcomes.add(ok)
              if len(outcomes) == 2: break
          print(f"Observed passing={True in outcomes} failing={False in outcomes}", flush=True)
          raise SystemExit(False in outcomes)
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generated-input-worker-logs
          path: ${{ runner.temp }}/include-evidence
          retention-days: 1
