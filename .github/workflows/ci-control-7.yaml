name: Run the merged macOS test-selection harness
on:
  push:
    branches: [charlie/ci-control-pr-7]
permissions:
  contents: read
  actions: read
jobs:
  testselect:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [cranelift, llvm]
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RA_JIT_SANDBOX: ""
      PYTHON: python3
      RA_JIT_BACKEND: ${{ matrix.backend }}
      RA_JIT_OPT: 2
      RA_JIT_EMIT: fast
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 097e074391eefd9bb8f8935d9c53d63cba212cde
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: run
      - uses: actions/download-artifact@v8
        with:
          name: probe-macos
          run-id: 40460066029
          github-token: ${{ github.token }}
          path: target/release
      - working-directory: target/release
        run: |
          tar -xf probe.tar
          echo "RA_JIT_BIN=$PWD/ra-jit" >> "$GITHUB_ENV"
      - name: Run the test-selection harness
        working-directory: harness
        run: $PYTHON testselect.py
      - name: Daemon logs
        if: failure()
        run: |
          find /tmp -maxdepth 3 -name daemon.log 2>/dev/null | sort -u | while read -r log; do
            echo "::group::$log"
            tail -n 60 "$log"
            echo "::endgroup::"
          done
