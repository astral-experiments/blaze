name: Verify disambiguated test calls on hosted Linux and macOS
on:
  push:
    branches: [charlie/ci-control-pr-7]
permissions:
  contents: read
  actions: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: nscloud-macos-sequoia-arm64-6x14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1a4dad4435d682603736262b03c2bfa1160b1fa7
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: nix develop --command cargo build -p ra-jit --release --features llvm --locked
        env:
          RUSTC_WRAPPER: sccache
      - run: tar -cf probe.tar ra-jit cargo-ra-jit ra-jit-rustc ra-jit-rustc-first
        working-directory: target/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: probe-${{ matrix.platform }}
          path: target/release/probe.tar
          retention-days: 1
  fixture:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1a4dad4435d682603736262b03c2bfa1160b1fa7
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: run
      - if: matrix.platform == 'linux'
        name: Wait for the PR's Linux build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..24}; do
            if [[ "$(gh api 'repos/${{ github.repository }}/actions/runs/40457448806/artifacts?name=ra-jit-linux-x64' --jq .total_count)" -gt 0 ]]; then exit 0; fi
            sleep 15
          done
          exit 1
      - uses: actions/download-artifact@v8
        if: matrix.platform == 'linux'
        with:
          name: ra-jit-linux-x64
          run-id: 40457448806
          github-token: ${{ github.token }}
          path: target/release
      - uses: actions/download-artifact@v8
        if: matrix.platform == 'macos'
        with:
          name: probe-macos
          path: target/release
      - run: tar -xf ${{ matrix.platform == 'linux' && 'ra-jit.tar' || 'probe.tar' }}
        working-directory: target/release
      - name: Run the original and expanded fixtures under both CI backends
        working-directory: harness
        shell: bash
        run: |
          git show 9bc237eddb96020ceecd24a92f1fa5e96226a792:harness/testselect.py > testselect_original.py
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile
          import testselect
          import testselect_original

          binary = pathlib.Path("../target/release").resolve()
          failures = 0
          for name, module in (("original", testselect_original), ("expanded", testselect)):
              for backend in ("cranelift", "llvm"):
                  with tempfile.TemporaryDirectory() as root, tempfile.TemporaryDirectory(dir="/tmp") as home:
                      env = dict(os.environ, PATH=f"{binary}:{os.environ['PATH']}", RA_JIT_HOME=home,
                                 RA_JIT_BIN=str(binary/"ra-jit"), RA_JIT_BACKEND=backend,
                                 RA_JIT_OPT="2", RA_JIT_EMIT="fast", RUST_BACKTRACE="0", CARGO_TERM_COLOR="never",
                                 CARGO_INCREMENTAL="0")
                      try:
                          result = module.unchanged_instances(root, env)
                          print(f"{name} / {backend}: {result}", flush=True)
                          failures += result != "ok"
                      finally:
                          subprocess.run(["cargo","ra-jit","stop"], cwd=pathlib.Path(root)/"unchanged",
                                         env=env, capture_output=True)
          raise SystemExit(bool(failures))
          PY
