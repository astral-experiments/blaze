name: Diagnose the multi-harness CI failure
on:
  push:
    branches: [charlie/ci-control-pr-7]
permissions:
  contents: read
  actions: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9bc237eddb96020ceecd24a92f1fa5e96226a792
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: run
      - uses: actions/download-artifact@v8
        with:
          name: ra-jit-linux-x64
          path: target/release
          github-token: ${{ github.token }}
          run-id: 40450861091
      - run: tar -xf ra-jit.tar
        working-directory: target/release
      - name: Compare the unmodified CI fixture with the pinned rustc
        working-directory: harness
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess
          import tempfile

          import testselect

          binaries = pathlib.Path("../target/release").resolve()
          cases = (("CI Cranelift", {"RA_JIT_BACKEND":"cranelift","RA_JIT_OPT":"2","RA_JIT_EMIT":"fast"}),
                   ("CI LLVM", {"RA_JIT_BACKEND":"llvm","RA_JIT_OPT":"2","RA_JIT_EMIT":"fast"}),
                   ("workstation defaults", {}))
          failures = 0
          for label, settings in cases:
              with tempfile.TemporaryDirectory() as root, tempfile.TemporaryDirectory(dir="/tmp") as home:
                  env = dict(os.environ, PATH=f"{binaries}:{os.environ['PATH']}", RA_JIT_BIN=str(binaries/"ra-jit"),
                             RA_JIT_HOME=home, RUST_BACKTRACE="0", **settings)
                  ws = pathlib.Path(root) / "unchanged"
                  try:
                      result = testselect.unchanged_instances(root, env)
                      print(f"{label}: {result}", flush=True)
                      failures += result != "ok"
                      if label == "CI Cranelift":
                          bootstrap = dict(env, RUSTC_BOOTSTRAP="1")
                          rustc = subprocess.run(["cargo","test","--tests","--target-dir",str(ws/"oracle")],
                                                 cwd=ws, env=bootstrap, text=True, capture_output=True)
                          print(f"pinned rustc: {rustc.returncode}\n{rustc.stdout}{rustc.stderr}", flush=True)
                          failures += rustc.returncode != 0
                          if result != "ok" and shutil.which("strace"):
                              trace = pathlib.Path(root) / "trace"
                              more = subprocess.run(["strace","-f","-e","trace=wait4,waitid,exit_group",
                                  "-o",str(trace),"cargo","ra-jit","test","--lib","-v"],
                                  cwd=ws, env=dict(bootstrap, RA_JIT_TESTS="all"), text=True, capture_output=True)
                              print(f"sandboxed rerun: {more.returncode}\n{more.stdout}{more.stderr}", flush=True)
                              print("\n".join(s for s in trace.read_text().splitlines()
                                    if any(k in s for k in ("SIGSEGV","SIGSYS","SIGILL","SIGABRT","SIGBUS")))[-3000:])
                  finally:
                      subprocess.run(["cargo","ra-jit","stop"], env=env, cwd=ws, capture_output=True)
          raise SystemExit(bool(failures))
          PY
