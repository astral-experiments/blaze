name: Run the merged macOS test-selection harness
on:
  push:
    branches: [charlie/ci-control-pr-7]
permissions:
  contents: read
  actions: read
jobs:
  testselect:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [cranelift, llvm]
    env:
      RA_JIT_BACKEND: ${{ matrix.backend }}
      RA_JIT_OPT: 2
      RA_JIT_EMIT: fast
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 097e074391eefd9bb8f8935d9c53d63cba212cde
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: run
      - uses: actions/download-artifact@v8
        with:
          name: probe-macos
          run-id: 40460066029
          github-token: ${{ github.token }}
          path: target/release
      - working-directory: target/release
        run: |
          tar -xf probe.tar
          echo "RA_JIT_BIN=$PWD/ra-jit" >> "$GITHUB_ENV"
      - name: Run the test-selection harness
        run: $PYTHON harness/testselect.py
      - name: Compare canonical and symlinked temporary paths after a failure
        if: failure()
        working-directory: harness
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          import testselect

          binary = Path(os.environ["RA_JIT_BIN"]).parent
          for name in ("default", "canonical", "runner-temp"):
              parent = os.environ["RUNNER_TEMP"] if name == "runner-temp" else None
              with tempfile.TemporaryDirectory(dir=parent) as root, tempfile.TemporaryDirectory(dir="/tmp") as home:
                  work = os.path.realpath(root) if name == "canonical" else root
                  print(f"{name}: {work} (physical: {os.path.realpath(work)})", flush=True)
                  env = dict(os.environ, PATH=f"{binary}:{os.environ['PATH']}", RA_JIT_HOME=home, RUST_BACKTRACE="0")
                  try:
                      print(f"{name}: {testselect.unchanged_instances(work, env)}", flush=True)
                  finally:
                      subprocess.run(["cargo", "ra-jit", "stop"], cwd=Path(work)/"unchanged", env=env, capture_output=True)
          PY
      - name: Daemon logs
        if: failure()
        run: |
          find /tmp -maxdepth 3 -name daemon.log 2>/dev/null | sort -u | while read -r log; do
            echo "::group::$log"
            tail -n 60 "$log"
            echo "::endgroup::"
          done
