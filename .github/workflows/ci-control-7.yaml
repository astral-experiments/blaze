name: Check the native symbol fix against both test fixtures
on:
  push:
    branches: [charlie/ci-control-pr-7]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: namespace-profile-ubuntu-24-04-16
          - platform: macos
            runner: nscloud-macos-sequoia-arm64-6x14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 065f3bd3f0355d86aab63b423c0ae97b131c3800
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the candidate to the current main
        run: |
          git -c user.name=CI -c user.email=ci@users.noreply.github.com merge --no-ff --no-commit 4bb212d8d615838d0ebee46c6644a1de62e534c1
          git status --short
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: nix develop --command cargo build -p ra-jit --release --features llvm --locked
        env:
          RUSTC_WRAPPER: sccache
      - run: tar -cf probe.tar ra-jit cargo-ra-jit ra-jit-rustc ra-jit-rustc-first
        working-directory: target/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: probe-${{ matrix.platform }}
          path: target/release/probe.tar
          retention-days: 1
  fixture:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 065f3bd3f0355d86aab63b423c0ae97b131c3800
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: run
      - uses: actions/download-artifact@v8
        with:
          name: probe-${{ matrix.platform }}
          path: target/release
      - run: tar -xf probe.tar
        working-directory: target/release
      - name: Run the original and expanded fixtures under both CI backends
        working-directory: harness
        shell: bash
        run: |
          git show 9bc237eddb96020ceecd24a92f1fa5e96226a792:harness/testselect.py > testselect_original.py
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile
          import testselect
          import testselect_original

          binary = pathlib.Path("../target/release").resolve()
          failures = 0
          for name, module in (("original", testselect_original), ("expanded", testselect)):
              for backend in ("cranelift", "llvm"):
                  with tempfile.TemporaryDirectory() as root, tempfile.TemporaryDirectory(dir="/tmp") as home:
                      env = dict(os.environ, PATH=f"{binary}:{os.environ['PATH']}", RA_JIT_HOME=home,
                                 RA_JIT_BIN=str(binary/"ra-jit"), RA_JIT_BACKEND=backend,
                                 RA_JIT_OPT="2", RA_JIT_EMIT="fast", RUST_BACKTRACE="0", CARGO_TERM_COLOR="never")
                      try:
                          result = module.unchanged_instances(root, env)
                          print(f"{name} / {backend}: {result}", flush=True)
                          failures += result != "ok"
                      finally:
                          subprocess.run(["cargo","ra-jit","stop"], cwd=pathlib.Path(root)/"unchanged",
                                         env=env, capture_output=True)
          raise SystemExit(bool(failures))
          PY
