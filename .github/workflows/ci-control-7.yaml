name: Trace compilation of the native test body
on:
  push:
    branches: [charlie/ci-control-pr-7]
permissions:
  contents: read
jobs:
  trace:
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c8d198814f29545db3cc391e2a898ebed03ce97c
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Trace rejected instances in this control build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/hir-ty-codegen/mod.rs")
          data = path.read_text()
          one = "                if let Err(e) = defined {\n                    if self.forward_to_rustc"
          assert data.count(one) == 1
          data = data.replace(one, '                if let Err(e) = defined {\n                    eprintln!("BLAZE_DIAG cannot compile {}: {e}", self.callee_name(instance.def));\n                    if self.forward_to_rustc')
          two = "        let symbol = self.rustc_copy(symbol, instance.checked)?;\n        let sig = self.module"
          assert data.count(two) == 1
          data = data.replace(two, '        let symbol = self.rustc_copy(symbol, instance.checked)?;\n        eprintln!("BLAZE_DIAG candidate {} -> {symbol}", self.callee_name(instance.def));\n        if symbol.contains("9unchanged7library") { return None; }\n        let sig = self.module')
          path.write_text(data)
          PY
      - run: nix develop --command cargo build -p ra-jit --release --features llvm --locked
        env:
          RUSTC_WRAPPER: sccache
      - name: Trace the original regression fixture
        working-directory: harness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess, tempfile
          import testselect
          binary = Path("../target/release").resolve()
          home, root = tempfile.mkdtemp(dir="/tmp"), tempfile.mkdtemp()
          env = dict(os.environ, PATH=f"{binary}:{os.environ['PATH']}", RA_JIT_HOME=home,
                     RA_JIT_BIN=str(binary/"ra-jit"), RA_JIT_BACKEND="cranelift",
                     RA_JIT_OPT="2", RA_JIT_EMIT="fast", CARGO_TERM_COLOR="never")
          result = testselect.unchanged_instances(root, env)
          print("FIXTURE", result, flush=True)
          subprocess.run(["cargo", "ra-jit", "stop"], cwd=Path(root)/"unchanged", env=env, capture_output=True)
          for path in Path(home).rglob("log"):
              if path.is_file():
                  print(path)
                  print("\n".join(l for l in path.read_text(errors="replace").splitlines()
                        if "BLAZE_DIAG" in l or "left to rustc" in l or "unsupported" in l)[:12000])
          PY
