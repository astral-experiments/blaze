# Sends what main changed under vendor/ to the indexable-inc forks (vendor/subtree.py push):
# indexable-inc/rust-analyzer `ra-jit` and indexable-inc/rustc_abi `main`. It only
# fast-forwards a fork's branch, and fails, pushing nothing, if the fork has a change main does
# not.
#
# Needs the secret FORK_PUSH_TOKEN: a fine-grained token (or GitHub App token) with Contents
# read and write on indexable-inc/rust-analyzer and indexable-inc/rustc_abi.
name: fork sync
on:
  push:
    branches: ["main"]
    paths:
      - "vendor/**"
      - ".github/workflows/fork-sync.yaml"
  workflow_dispatch:

# One at a time and none cancelled: each run pushes everything main has that the fork lacks,
# so a later run finishes what an earlier one did not.
concurrency:
  group: fork-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fork credentials
        env:
          FORK_PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
        run: |
          if [ -z "$FORK_PUSH_TOKEN" ]; then
            echo "::error::The secret FORK_PUSH_TOKEN is not set: add a token with Contents read and write on indexable-inc/rust-analyzer and indexable-inc/rustc_abi to indexable-inc/blaze's Actions secrets."
            exit 1
          fi
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FORK_PUSH_TOKEN" | base64 -w0)"
      - run: python3 vendor/subtree.py push rust-analyzer
      - run: python3 vendor/subtree.py push rustc_abi
